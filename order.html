<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        nav {
            background-color: #007bff;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-size: 18px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            padding: 20px;
        }
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: nowrap;
            max-width: 100%;
        }
        .item img {
            width: 80px;
            height: auto;
            margin-right: 10px;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quantity-control button {
            width: 30px;
            height: 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 20px;
            line-height: 1;
        }
        .quantity-control input[type="number"] {
            width: 60px;
            text-align: center;
            margin: 0 5px;
            padding: 5px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input[type="tel"],
        .form-group input[type="date"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" onclick="showPage('orderPage')">Home</a>
        <a href="https://utpmy-my.sharepoint.com/:x:/g/personal/zhen_20000007_utp_edu_my/EZW3oyk4QAJBtB3JQS1hnN4B6pT2ZntHeNHZLW7PwbC8Xw?email=wloveqr%40gmail.com&e=lCqqsA">Data</a>
    </nav>

    <div id="orderPage" class="container">
        <h1>Food Order Form</h1>
        <form id="orderForm">
            <div class="item">
                <img src="chicken.jpeg" alt="Roast Chicken">
                <label>烧鸡</label>
                <div class="quantity-control">
                    <button type="button" onclick="changeQuantity('roast_chicken', -1)">-</button>
                    <input type="number" name="roast_chicken" value="0" min="0">
                    <button type="button" onclick="changeQuantity('roast_chicken', 1)">+</button>
                </div>
            </div>
            <div class="item">
                <img src="duck.jpeg" alt="Roast Duck">
                <label>烧鸭</label>
                <div class="quantity-control">
                    <button type="button" onclick="changeQuantity('roast_duck', -1)">-</button>
                    <input type="number" name="roast_duck" value="0" min="0">
                    <button type="button" onclick="changeQuantity('roast_duck', 1)">+</button>
                </div>
            </div>
            <div class="item">
                <img src="pork.jpeg" alt="Roast Pork">
                <label>烧肉</label>
                <div class="quantity-control">
                    <button type="button" onclick="changeQuantity('roast_pork', -1)">-</button>
                    <input type="number" name="roast_pork" value="0" min="0">
                    <button type="button" onclick="changeQuantity('roast_pork', 1)">+</button>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel" name="phone_number" required>
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="date" name="date" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        const flowUrl = "https://prod-59.southeastasia.logic.azure.com:443/workflows/2aad9561df9c4719abfb71db029eeddb/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=_NYLjRd47iZxuzaMetivnUZvs0q814JlEck3hkQsRik";

        function changeQuantity(itemName, change) {
            const input = document.querySelector(`input[name="${itemName}"]`);
            const currentValue = parseInt(input.value);
            if (currentValue + change >= 0) {
                input.value = currentValue + change;
            }
        }

        document.getElementById('orderForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const orderData = {
                date: document.querySelector('input[name="date"]').value,
                phone_number: document.querySelector('input[name="phone_number"]').value,
                roast_chicken: parseInt(document.querySelector('input[name="roast_chicken"]').value),
                roast_duck: parseInt(document.querySelector('input[name="roast_duck"]').value),
                roast_pork: parseInt(document.querySelector('input[name="roast_pork"]').value)
            };
            saveOrder(orderData);
        });

        function saveOrder(order) {
            fetch(flowUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(order)
            })
            .then(response => {
                if (response.ok) {
                    alert('Order submitted successfully!');
                } else {
                    alert('Failed to save order.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred.');
            });
        }
    </script>
</body>
</html>
